# pr.yml - pull request smoke build and test on Linux and Windows.
# Module: ci (GitHub Actions).
# Owns: clang-release and clang-cl-release PR gates with ctest.
# Depends: CMake presets clang-release / clang-cl-release.
name: PR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x86_64 (clang-release)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Clang, LLVM, Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm ninja-build build-essential

      - name: Configure (clang-release)
        run: cmake --preset clang-release

      - name: Build
        run: cmake --build --preset clang-release --parallel

      - name: Test
        run: ctest --preset clang-release --output-on-failure

      - name: ANSI / terminal matrix smoke
        run: |
          chmod +x scripts/ansi_matrix_smoke.sh
          env -u NO_COLOR TERM=xterm-256color scripts/ansi_matrix_smoke.sh \
            build/clang-release/bin/antinomia \
            build/clang-release/bin/re_test_ansi
          NO_COLOR=1 TERM=dumb scripts/ansi_matrix_smoke.sh \
            build/clang-release/bin/antinomia

      - name: MCP plugin example smoke
        run: |
          python3 docs/examples/mcp_plugin.py \
            --antinomia build/clang-release/bin/antinomia

      - name: Package smoke (linux archive + symbols stub)
        run: |
          chmod +x scripts/package_release.sh
          scripts/package_release.sh \
            --os linux \
            --version "0.0.0-ci" \
            --bin build/clang-release/bin/antinomia \
            --out dist-ci \
            --with-symbols-stub
          test -f dist-ci/antinomia-0.0.0-ci-linux-x86_64.tar.gz
          test -f dist-ci/antinomia-0.0.0-ci-linux-x86_64-symbols.tar.gz
          tar -tzf dist-ci/antinomia-0.0.0-ci-linux-x86_64.tar.gz | grep -q '/antinomia$'
          ./dist-ci/antinomia-0.0.0-ci-linux-x86_64 version
          ./dist-ci/antinomia-0.0.0-ci-linux-x86_64 privacy

      - name: Phase 1 workflow from packaged binary
        run: |
          chmod +x scripts/phase1_release_smoke.sh
          scripts/phase1_release_smoke.sh \
            --archive dist-ci/antinomia-0.0.0-ci-linux-x86_64.tar.gz \
            --inferior build/clang-release/bin/loop_inferior

      - name: CI-bounded soak (random step/BP)
        run: |
          chmod +x scripts/soak_fuzz.sh
          scripts/soak_fuzz.sh \
            --antinomia build/clang-release/bin/antinomia \
            --inferior build/clang-release/bin/loop_inferior \
            --seconds 90 \
            --seed 1

  windows:
    name: Windows x86_64 (clang-cl-release)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: bash
        run: |
          choco install ninja -y --no-progress
          which clang-cl
          clang-cl --version

      - name: Configure (clang-cl-release)
        shell: bash
        run: cmake --preset clang-cl-release

      - name: Build
        shell: bash
        run: cmake --build --preset clang-cl-release --parallel

      - name: Test
        shell: bash
        run: ctest --preset clang-cl-release --output-on-failure

      - name: Privacy + ANSI unit smoke
        shell: bash
        run: |
          ./build/clang-cl-release/bin/antinomia.exe privacy
          ./build/clang-cl-release/bin/antinomia.exe privacy --seed 42
          ./build/clang-cl-release/bin/re_test_ansi.exe

      - name: Package smoke (windows archive + symbols stub)
        shell: bash
        run: |
          chmod +x scripts/package_release.sh
          scripts/package_release.sh \
            --os windows \
            --version "0.0.0-ci" \
            --bin build/clang-cl-release/bin/antinomia.exe \
            --out dist-ci \
            --with-symbols-stub
          test -f dist-ci/antinomia-0.0.0-ci-windows-x86_64.zip
          test -f dist-ci/antinomia-0.0.0-ci-windows-x86_64-symbols.zip
          ./dist-ci/antinomia-0.0.0-ci-windows-x86_64.exe version
          ./dist-ci/antinomia-0.0.0-ci-windows-x86_64.exe privacy
