# release.yml - build Clang release packages and attach them to a GitHub Release.
# Module: ci (GitHub Actions).
# Owns: Linux/Windows archives, bare binaries, symbols stubs, SHA256SUMS.
# Depends: scripts/package_release.sh; presets clang-release / clang-cl-release.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and (re)attach assets to"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux x86_64 (clang-release)
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Clang, LLVM, Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm ninja-build build-essential

      - name: Configure (clang-release)
        run: cmake --preset clang-release

      - name: Build
        run: cmake --build --preset clang-release --parallel

      - name: Test
        run: ctest --preset clang-release --output-on-failure

      - name: Package
        run: |
          chmod +x scripts/package_release.sh
          scripts/package_release.sh \
            --os linux \
            --version "${RELEASE_TAG}" \
            --bin build/clang-release/bin/antinomia \
            --out dist \
            --with-symbols-stub
          clang --version | tee dist/COMPILER-linux.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows x86_64 (clang-cl-release)
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: bash
        run: |
          choco install ninja -y --no-progress
          which clang-cl
          clang-cl --version
          which clang-format || true
          clang-format --version || true

      - name: Configure (clang-cl-release)
        shell: bash
        run: cmake --preset clang-cl-release

      - name: Build
        shell: bash
        run: cmake --build --preset clang-cl-release --parallel

      - name: Test
        shell: bash
        run: ctest --preset clang-cl-release --output-on-failure

      - name: Package
        shell: bash
        run: |
          chmod +x scripts/package_release.sh
          scripts/package_release.sh \
            --os windows \
            --version "${RELEASE_TAG}" \
            --bin build/clang-cl-release/bin/antinomia.exe \
            --out dist \
            --with-symbols-stub
          clang-cl --version | tee dist/COMPILER-windows.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: dist

      - name: Merge SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          {
            echo "# antinomia ${RELEASE_TAG}"
            echo "# generated by scripts/package_release.sh + release.yml"
            ls -1 antinomia-* COMPILER-*.txt 2>/dev/null | sort | while read -r f; do
              [[ -f "$f" ]] || continue
              sha256sum "$f"
            done
          } >SHA256SUMS
          ls -la
          cat SHA256SUMS

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: antinomia ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/antinomia-*-linux-x86_64
            dist/antinomia-*-linux-x86_64.tar.gz
            dist/antinomia-*-linux-x86_64-symbols.tar.gz
            dist/antinomia-*-windows-x86_64.exe
            dist/antinomia-*-windows-x86_64.zip
            dist/antinomia-*-windows-x86_64-symbols.zip
            dist/SHA256SUMS
            dist/COMPILER-linux.txt
            dist/COMPILER-windows.txt
          body: |
            Clang/LLVM primary release builds of **antinomia**.

            Changelog: `CHANGELOG.md`. Tutorial: `docs/x64dbg-5min.md`.
            Clean VM: `docs/clean-vm.md`. Soak: `docs/soak.md`.

            ## Downloads
            - **Linux x86_64 archive**: `antinomia-${{ env.RELEASE_TAG }}-linux-x86_64.tar.gz` (preset `clang-release`)
            - **Linux x86_64 binary**: `antinomia-${{ env.RELEASE_TAG }}-linux-x86_64`
            - **Windows x86_64 archive**: `antinomia-${{ env.RELEASE_TAG }}-windows-x86_64.zip` (preset `clang-cl-release`, static CRT)
            - **Windows x86_64 binary**: `antinomia-${{ env.RELEASE_TAG }}-windows-x86_64.exe`
            - **Symbols stubs** (placeholders): `*-symbols.tar.gz` / `*-symbols.zip`
            - **Checksums**: `SHA256SUMS`

            ## Build defaults
            - `RE_ENABLE_DISASM=OFF`
            - `RE_ENABLE_CAPSTONE=OFF`
            - Packaging: `scripts/package_release.sh --with-symbols-stub`
            - Checklist: `docs/release-checklist.md`

            ## Verify
            ```bash
            tar -xzf antinomia-*-linux-x86_64.tar.gz
            ./antinomia-*/antinomia version
            sha256sum -c SHA256SUMS --ignore-missing
            ```
            On Windows, expand the zip and run `antinomia.exe version` (SmartScreen
            may warn on unsigned first runs until Authenticode lands).

            Phase 1 clean-VM loop: `docs/clean-vm.md`. Full 1h soak:
            `SOAK_SECONDS=3600 scripts/soak_fuzz.sh` (`docs/soak.md`).
