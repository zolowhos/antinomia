# keys.ini - example keybindings (x64dbg-ish F-keys).
# Module: docs (INI).
# Owns: sample [keys] map for ANTINOMIA_KEYS / keys.ini.
# Depends: re_keys load path. JSON form is documented in docs/theme-keys.md.
[keys]
q=quit
Q=quit
Esc=quit
Tab=focus_next
S-Tab=focus_prev
F2=toggle_bp
F5=run
F7=step_into
F8=step_over
F9=run
F12=pause
